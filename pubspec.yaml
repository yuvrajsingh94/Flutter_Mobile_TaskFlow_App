name: taskflow_flutter
description: "Cross-platform Flutter client for Employee Task Manager (TaskFlow), targeting Android and iOS with shared backend."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & HTTP
  dio: ^5.4.3+1

  # Secure & Key-Value Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI, Icons, Typography & Utilities
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  phone_numbers_parser: ^9.0.26

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
